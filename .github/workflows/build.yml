name: Build Blend Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Gradle and Keystore
      run: |
        # التأكد من وجود gradlew
        if [ ! -f "gradlew" ]; then
          wget -q https://raw.githubusercontent.com/cortinico/kotlin-android-template/main/gradlew
          chmod +x gradlew
          mkdir -p gradle/wrapper
          wget -q https://raw.githubusercontent.com/cortinico/kotlin-android-template/main/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        else
          chmod +x gradlew
        fi

        # ضبط إصدار Gradle ليكون 9.3.1 المطلوب للـ Android Gradle Plugin
        mkdir -p gradle/wrapper
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

        # إنشاء ملف debug.keystore وتوزيعه
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p app
        cp debug.keystore app/debug.keystore

    - name: Build with Gradle
      run: ./gradlew assembleDebug -Pandroid.useAndroidX=true -Djava.awt.headless=true --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BlendLauncher-APK
        path: app/build/outputs/apk/debug/*.apk
