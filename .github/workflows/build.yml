name: Build Blend Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Debug Keystore
      run: |
        # إنشاء ملف debug.keystore تلقائياً لتوقيع الـ APK
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug -Pandroid.useAndroidX=true -Djava.awt.headless=true --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BlendLauncher-APK
        path: app/build/outputs/apk/debug/*.apk
